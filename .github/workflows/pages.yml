name: Deploy Interactive Demo
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/create_demo_video.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recording prerequisites
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Render walkthrough MP4 from demo page
        run: python scripts/create_demo_video.py
      - name: Validate generated video
        run: |
          test -s docs/demo.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 docs/demo.mp4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
