name: Deploy InvestOne Demo with Narrated Video
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_narrated_demo.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          sudo ln -sf /usr/bin/espeak-ng /usr/local/bin/espeak
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Generate narrated MP4 from latest light-theme demo
        run: |
          python scripts/build_narrated_demo.py
          ls -lah docs/demo.mp4
      - name: Check embedded audio and video
        run: |
          test -s docs/demo.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type -of default=noprint_wrappers=1 docs/demo.mp4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
