name: Deploy InvestOne Interactive Demo
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/test_interactive_demo.py'
      - 'src/**'
      - 'packaging/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the original narrated video byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            "https://changxuanyu26-collab.github.io/InvestOne_ENT207-/demo.mp4" -o docs/demo.mp4
          test "$(stat -c%s docs/demo.mp4)" -gt 500000
          echo "Published source MP4 checksum:"
          sha256sum docs/demo.mp4
      - name: Check interactive app syntax
        run: |
          node --check docs/five-core.js
          node --check src/web/app.js
      - name: Install browser for live interaction smoke tests
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Smoke test five linked features and unchanged video reference
        run: python scripts/test_interactive_demo.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify application before distribution
        working-directory: src
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Package six downloadable desktop editions
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/build-all.sh
          mkdir -p docs/downloads
          cp dist/InvestOne-v2.1.0-rc1-*.zip docs/downloads/
          cp dist/SHA256SUMS.txt docs/downloads/
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          for p in sorted(Path('docs/downloads').glob('*.zip')):
              with ZipFile(p) as z:
                  assert z.testzip() is None
                  paths = z.namelist()
                  assert any(x.endswith('README.md') for x in paths)
                  assert any(x.endswith('.command') or x.endswith('.cmd') or x.endswith('.sh') for x in paths)
              print('Verified', p.name, p.stat().st_size, sha256(p.read_bytes()).hexdigest())
          assert len(list(Path('docs/downloads').glob('*.zip'))) == 6
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
