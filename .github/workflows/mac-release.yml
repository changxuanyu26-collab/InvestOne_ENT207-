name: Build InvestOne for Windows Mac and Linux
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'docs/MULTIPLATFORM.md'
      - '.github/workflows/mac-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Unit tests and static analysis
        working-directory: src
        run: |
          go test -count=1 ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Build and validate six platform ZIPs
        run: bash packaging/build-all.sh
      - name: Download package Windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: InvestOne-v2.1.0-rc1-Windows-x64
          path: dist/InvestOne-v2.1.0-rc1-Windows-x64.zip
          retention-days: 90
      - name: Download package Windows-ARM64
        uses: actions/upload-artifact@v4
        with:
          name: InvestOne-v2.1.0-rc1-Windows-ARM64
          path: dist/InvestOne-v2.1.0-rc1-Windows-ARM64.zip
          retention-days: 90
      - name: Download package Mac-AppleSilicon
        uses: actions/upload-artifact@v4
        with:
          name: InvestOne-v2.1.0-rc1-Mac-AppleSilicon
          path: dist/InvestOne-v2.1.0-rc1-Mac-AppleSilicon.zip
          retention-days: 90
      - name: Download package Mac-Intel
        uses: actions/upload-artifact@v4
        with:
          name: InvestOne-v2.1.0-rc1-Mac-Intel
          path: dist/InvestOne-v2.1.0-rc1-Mac-Intel.zip
          retention-days: 90
      - name: Download package Linux-x64
        uses: actions/upload-artifact@v4
        with:
          name: InvestOne-v2.1.0-rc1-Linux-x64
          path: dist/InvestOne-v2.1.0-rc1-Linux-x64.zip
          retention-days: 90
      - name: Download package Linux-ARM64
        uses: actions/upload-artifact@v4
        with:
          name: InvestOne-v2.1.0-rc1-Linux-ARM64
          path: dist/InvestOne-v2.1.0-rc1-Linux-ARM64.zip
          retention-days: 90
      - name: Checksums and all-platform download
        uses: actions/upload-artifact@v4
        with:
          name: InvestOne-v2.1.0-rc1-All-Platforms
          path: |
            dist/InvestOne-v2.1.0-rc1-*.zip
            dist/SHA256SUMS.txt
          retention-days: 90
