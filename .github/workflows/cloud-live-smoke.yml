name: Verify Live InvestOne Cloud End to End
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cloud_live_smoke.py'
      - 'scripts/cloud_browser_smoke.py'
      - 'scripts/auth_browser_smoke.py'
      - '.github/workflows/cloud-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install chromium
      - name: Wait for the matching Railway release
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request
          expected = hashlib.sha256(pathlib.Path('src/web/app.js').read_bytes()).digest()
          url = 'https://investone-live-production.up.railway.app/app.js'
          for attempt in range(48):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      if hashlib.sha256(response.read()).digest() == expected:
                          print('Matching Railway app is online')
                          break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Matching Railway release did not become ready')
          PY
      - name: Validate account creation, sign-in, isolated workspaces and mobile access
        env:
          INVESTONE_LIVE_URL: https://investone-live-production.up.railway.app
        run: python3 scripts/auth_browser_smoke.py
      - name: Validate desktop and mobile live web UI, real navigation and avatar controls
        env:
          INVESTONE_LIVE_URL: https://investone-live-production.up.railway.app
        run: python3 scripts/cloud_browser_smoke.py
      - name: Test actual deployed HTTPS endpoint, distinct visitors, real financial data and news
        env:
          INVESTONE_LIVE_URL: https://investone-live-production.up.railway.app
        run: python3 scripts/cloud_live_smoke.py
